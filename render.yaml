services:
  # Unified Service: Backend + Frontend
  - type: web
    name: kryv-app
    runtime: node
    buildCommand: corepack enable && pnpm install && pnpm --filter @workspace/blyze build && pnpm --filter @workspace/api-server build && ls -R artifacts/blyze/dist
    startCommand: node artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # ── FastPix Live Streaming ─────────────────────────────────────────────
      # ACCESS_TOKEN  = FastPix Access Token ID (username for Basic Auth)
      # SECRET_KEY    = FastPix Secret Key (password for Basic Auth)
      - key: ACCESS_TOKEN
        sync: false
      - key: SECRET_KEY
        sync: false
      # FASTPIX_WEBHOOK_SECRET: signing secret from FastPix dashboard
      # Used to verify inbound webhooks at /api/webhooks/fastpix
      - key: FASTPIX_WEBHOOK_SECRET
        sync: false
      # ── Legacy MUX (kept for backward compat) ─────────────────────────────
      - key: MUX_TOKEN_ID
        sync: false
      - key: MUX_TOKEN_SECRET
        sync: false
      - key: MUX_WEBHOOK_SECRET
        sync: false
      # ── CORS ─────────────────────────────────────────────────────────────────────────────────────────
      # ALLOWED_ORIGINS: comma-separated list of allowed frontend origins
      # Set this to your production domain(s), e.g. https://kryv.tv,https://www.kryv.tv
      # In development (NODE_ENV != production), all origins are allowed.
      - key: ALLOWED_ORIGINS
        sync: false
