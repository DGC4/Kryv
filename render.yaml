# Kryv production topology
# FastPix remains the media data plane. These services only run Kryv's control,
# realtime, and asynchronous work; they never proxy video bytes.

previews:
  generation: manual

services:
  - type: web
    name: kryv-app
    runtime: node
    plan: starter
    numInstances: 1
    autoDeployTrigger: checksPass
    buildCommand: npx --yes pnpm@11.20.0 install --frozen-lockfile && npx --yes pnpm@11.20.0 --filter @workspace/blyze build && npx --yes pnpm@11.20.0 --filter @workspace/api-server build
    startCommand: node artifacts/api-server/dist/index.mjs
    healthCheckPath: /health
    maxShutdownDelaySeconds: 120
    envVars:
      - fromGroup: kryv-runtime-shared
      - key: KRYV_CACHE_REDIS_URL
        fromService:
          type: keyvalue
          name: kryv-cache
          property: connectionString
      - key: KRYV_QUEUE_REDIS_URL
        fromService:
          type: keyvalue
          name: kryv-queue
          property: connectionString

  # A separately restartable gateway for chat and live-control fan-out. HTTP writes,
  # moderation, entitlements, and balances remain authoritative in kryv-app.
  - type: web
    name: kryv-realtime
    runtime: node
    plan: starter
    numInstances: 1
    autoDeployTrigger: checksPass
    buildCommand: npx --yes pnpm@11.20.0 install --frozen-lockfile && npx --yes pnpm@11.20.0 --filter @workspace/api-server build
    startCommand: node artifacts/api-server/dist/realtime.mjs
    healthCheckPath: /health
    maxShutdownDelaySeconds: 120
    envVars:
      - fromGroup: kryv-runtime-shared
      - key: KRYV_CACHE_REDIS_URL
        fromService:
          type: keyvalue
          name: kryv-cache
          property: connectionString

  # A separately restartable event consumer for durable, non-request work. Payout
  # execution remains feature-flagged and cannot run until the documented gates pass.
  - type: worker
    name: kryv-worker
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server build
    startCommand: node artifacts/api-server/dist/worker.mjs
    maxShutdownDelaySeconds: 120
    envVars:
      - fromGroup: kryv-runtime-shared
      - key: KRYV_CACHE_REDIS_URL
        fromService:
          type: keyvalue
          name: kryv-cache
          property: connectionString
      - key: KRYV_QUEUE_REDIS_URL
        fromService:
          type: keyvalue
          name: kryv-queue
          property: connectionString

  # Loss-tolerant shared cache, rate-limit counters, presence, hot live cards, and
  # pub/sub. External access remains disabled; same-region services use private URLs.
  - type: keyvalue
    name: kryv-cache
    plan: starter
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off
    ipAllowList: []

  # Durable event and job stream. It is deliberately separate from cache because
  # queues must reject writes under pressure instead of silently evicting jobs.
  - type: keyvalue
    name: kryv-queue
    plan: starter
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []

envVarGroups:
  - name: kryv-runtime-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: KRYV_APP_URL
        sync: false
      - key: ACCESS_TOKEN
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: FASTPIX_WEBHOOK_SECRET
        sync: false
      - key: PLISIO_SECRET_KEY
        sync: false
      - key: PLISIO_CALLBACK_URL
        sync: false
      - key: PLISIO_ALLOWED_COINS
        value: BTC,LTC,ETH,DOGE
      - key: CREATOR_PAYOUT_ENCRYPTION_KEY
        sync: false
      - key: KRYV_ANALYTICS_WEBHOOK_URL
        sync: false
      - key: KRYV_ANALYTICS_WEBHOOK_SECRET
        sync: false
      - key: KRYV_REALTIME_TOKEN_SECRET
        sync: false
      # Opaque browser sessions are short-lived and server-revocable.
      - key: KRYV_SESSION_DAYS
        value: "7"
      # Navigation telemetry is disabled by default. Enabling it requires a stable
      # secret salt so no raw network or browser identifiers are retained.
      - key: KRYV_ACTIVITY_TRACKING_ENABLED
        value: "false"
      - key: KRYV_ACTIVITY_TRACKING_SALT
        sync: false
      # The diagnostic route is disabled in production unless deliberately opened
      # during a controlled incident.
      - key: KRYV_DEBUG_ENDPOINTS_ENABLED
        value: "false"
      # Public WSS origin for the separate kryv-realtime service, for example
      # wss://kryv-realtime.onrender.com/ws. This is not a credential.
      - key: VITE_REALTIME_URL
        sync: false
