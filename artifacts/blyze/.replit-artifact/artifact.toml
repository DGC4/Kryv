kind = "web"
previewPath = "/"
title = "Kryv"
version = "1.0.0"
id = "artifacts/blyze"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25671

[services.development]
run = "pnpm --filter @workspace/blyze run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/blyze", "run", "build" ]
serve = "static"
publicDir = "artifacts/blyze/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25671"
BASE_PATH = "/"
