openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Kryv live streaming platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: me
    description: Current user operations
  - name: categories
    description: Browse categories
  - name: channels
    description: Channel operations (Kryv Live — Twitch/Kick-style live streaming)
  - name: chat
    description: Live chat operations
  - name: moderation
    description: Channel moderation and chat-safety operations
  - name: discover
    description: Discovery / home page aggregates
  - name: clips
    description: Native short-form clips derived from Kryv video assets
  - name: videos
    description: On-demand video operations (Kryv Watch — YouTube-style uploads)
  - name: cinema
    description: Curated originals browsing (Kryv Cinema — Netflix-style library)
  - name: admin
    description: Owner-only backend administration (platform stats, user/channel/video moderation)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Get current user profile, own channel, and followed channels
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/profiles:
    get:
      operationId: listViewerProfiles
      tags: [me]
      summary: List the signed-in user's viewer profiles for profile-aware Cinema and watch state
      responses:
        "200":
          description: Viewer profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ViewerProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createViewerProfile
      tags: [me]
      summary: Create a viewer profile for the signed-in user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewerProfileInput"
      responses:
        "201":
          description: Created viewer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewerProfile"
        "400":
          description: Invalid viewer profile input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/profiles/{id}:
    patch:
      operationId: updateViewerProfile
      tags: [me]
      summary: Update a viewer profile owned by the signed-in user
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewerProfileUpdate"
      responses:
        "200":
          description: Updated viewer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewerProfile"
        "400":
          description: Invalid viewer profile input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Viewer profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteViewerProfile
      tags: [me]
      summary: Delete a non-default viewer profile owned by the signed-in user
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Viewer profile deleted
        "400":
          description: Default profile cannot be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Viewer profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /ads/decision:
    get:
      operationId: getAdDecision
      tags: [ads]
      summary: Evaluate whether a viewer session may receive a policy-eligible ad opportunity
      parameters:
        - name: surface
          in: query
          required: true
          schema: { type: string, enum: [live, watch, cinema, clip] }
        - name: channelId
          in: query
          required: false
          schema: { type: integer }
        - name: videoId
          in: query
          required: false
          schema: { type: integer }
        - name: profileId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: An explainable ad eligibility decision. A decision does not guarantee delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdDecision"

  /channels/{id}/ad-breaks:
    post:
      operationId: createChannelAdBreak
      tags: [ads]
      summary: Schedule or trigger an eligible creator ad break after server-side policy checks
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdBreakInput"
      responses:
        "201":
          description: Created ad opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdBreak"
        "400":
          description: Invalid ad break request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The creator or platform policy is not eligible to create an ad break
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/cinema/titles:
    get:
      operationId: listAdminCinemaTitles
      tags: [admin]
      summary: List owner-managed Cinema titles and their publishing state
      responses:
        "200":
          description: Cinema title drafts and published records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminCinemaTitle"
        "401": { description: Not authenticated }
        "403": { description: Owner access required }
    post:
      operationId: createAdminCinemaTitle
      tags: [admin]
      summary: Create a lawful Cinema title draft before rights and assets are approved
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCinemaTitleInput"
      responses:
        "201":
          description: Cinema title draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCinemaTitle"
        "400": { description: Invalid Cinema title input }
        "401": { description: Not authenticated }
        "403": { description: Owner access required }

  /admin/cinema/titles/{id}/assets:
    post:
      operationId: createAdminCinemaAsset
      tags: [admin]
      summary: Associate an approved FastPix feature, trailer, preview, or caption asset with a Cinema title
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCinemaAssetInput"
      responses:
        "201":
          description: Cinema asset associated with title
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCinemaAsset"
        "400": { description: Invalid Cinema asset input }
        "401": { description: Not authenticated }
        "403": { description: Owner access required }
        "404": { description: Cinema title not found }

  /admin/cinema/titles/{id}/upload-sessions:
    post:
      operationId: createAdminCinemaUploadSession
      tags: [admin]
      summary: Create an owner-only direct upload session for a Cinema title asset
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCinemaUploadSessionInput"
      responses:
        "201":
          description: Owner-authorized direct upload session and the pending Cinema asset record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCinemaUploadSession"
        "400": { description: Invalid Cinema upload request }
        "401": { description: Not authenticated }
        "403": { description: Owner access required }
        "404": { description: Cinema title not found }

  /admin/cinema/titles/{id}:
    get:
      operationId: getAdminCinemaTitle
      tags: [admin]
      summary: Retrieve the complete owner publishing record for a Cinema title
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Owner Cinema title detail, asset manifest, rights windows, readiness, and activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCinemaTitleDetail"
        "401": { description: Not authenticated }
        "403": { description: Owner access required }
        "404": { description: Cinema title not found }
    patch:
      operationId: updateAdminCinemaTitle
      tags: [admin]
      summary: Update title metadata or move a Cinema title through the governed publication workflow
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCinemaTitleUpdate"
      responses:
        "200":
          description: Updated owner Cinema title detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCinemaTitleDetail"
        "400": { description: Invalid title update }
        "401": { description: Not authenticated }
        "403": { description: Owner access required }
        "404": { description: Cinema title not found }
        "409": { description: The requested publication state is not eligible }

  /admin/cinema/titles/{id}/rights-windows:
    post:
      operationId: createAdminCinemaRightsWindow
      tags: [admin]
      summary: Add a rights and entitlement window to a Cinema title
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCinemaRightsWindowInput"
      responses:
        "201":
          description: Rights window added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCinemaRightsWindow"
        "400": { description: Invalid rights window }
        "401": { description: Not authenticated }
        "403": { description: Owner access required }
        "404": { description: Cinema title not found }

  /admin/cinema/titles/{id}/credits:
    post:
      operationId: createAdminCinemaCredit
      tags: [admin]
      summary: Attach a creator channel credit to an owner-managed Cinema title
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCinemaCreditInput"
      responses:
        "201":
          description: Creator credit attached to Cinema title
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCinemaCredit"
        "400": { description: Invalid Cinema credit input }
        "401": { description: Not authenticated }
        "403": { description: Owner access required }
        "404": { description: Cinema title or creator channel not found }
        "409": { description: This creator already has the same role on this title }

  /admin/cinema/titles/{id}/credits/{creditId}:
    delete:
      operationId: deleteAdminCinemaCredit
      tags: [admin]
      summary: Remove a creator credit from an owner-managed Cinema title
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: creditId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Creator credit removed }
        "401": { description: Not authenticated }
        "403": { description: Owner access required }
        "404": { description: Cinema credit not found }

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List browse categories with live counts. Filter by kind — live_game categories for Kryv Live, genre categories for Kryv Watch/Cinema.
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [live_game, genre]
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /discover/summary:
    get:
      operationId: getDiscoverSummary
      tags: [discover]
      summary: Home page aggregate — featured live channels, top categories, totals
      responses:
        "200":
          description: Discovery summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverSummary"

  /search:
    get:
      operationId: searchKryv
      tags: [discover]
      summary: Search public live channels, uploaded videos, and ready clips
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 64 }
      responses:
        "200":
          description: Search results grouped by content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        "400":
          description: Invalid search query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/followed/live:
    get:
      operationId: listFollowedLiveChannels
      tags: [discover]
      summary: List the signed-in viewer's followed channels that are currently live
      responses:
        "200":
          description: Followed live channels ranked by viewers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChannelSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/notification-preferences:
    get:
      operationId: getNotificationPreferences
      tags: [users]
      summary: Get the signed-in user's global notification preferences
      responses:
        "200":
          description: Current global notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: updateNotificationPreferences
      tags: [users]
      summary: Update the signed-in user's global notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferencesInput"
      responses:
        "200":
          description: Updated global notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "400":
          description: Invalid preference input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/activity-observability:
    get:
      operationId: getActivityObservabilityPreferences
      tags: [users]
      summary: Get the signed-in user's consent for minimized Kryv in-app activity visibility
      responses:
        "200":
          description: Current activity-observability preference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityObservabilityPreferences"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: updateActivityObservabilityPreferences
      tags: [users]
      summary: Update the signed-in user's consent for minimized Kryv in-app activity visibility
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityObservabilityPreferencesInput"
      responses:
        "200":
          description: Updated activity-observability preference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityObservabilityPreferences"
        "400":
          description: Invalid activity-observability preference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/activity-presence:
    post:
      operationId: reportActivityPresence
      tags: [users]
      summary: Record a consented, minimized Kryv in-app route class and device class
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityPresenceInput"
      responses:
        "204":
          description: Presence accepted
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Activity observability has not been enabled by the user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /channels:
    get:
      operationId: listChannels
      tags: [channels]
      summary: Browse channels, optionally filtered by category, live status, or search
      parameters:
        - name: categorySlug
          in: query
          required: false
          schema:
            type: string
        - name: live
          in: query
          required: false
          schema:
            type: boolean
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChannelSummary"
    post:
      operationId: createChannel
      tags: [channels]
      summary: Create a channel for the current user (become a creator)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelInput"
      responses:
        "201":
          description: Created channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDetail"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: User already has a channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /profiles/{slug}:
    get:
      operationId: getCreatorProfile
      tags: [profiles]
      summary: Get a public creator profile with live state, Watch uploads, and curated Cinema credits
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public creator profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorProfile"
        "404":
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /channels/{id}:
    get:
      operationId: getChannel
      tags: [channels]
      summary: Get a single channel's detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Channel detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDetail"
        "404":
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateChannel
      tags: [channels]
      summary: Update the current user's own channel (profile, category, offline)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelUpdate"
      responses:
        "200":
          description: Updated channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDetail"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not the channel owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /channels/slug/{slug}:
    get:
      operationId: getChannelBySlug
      tags: [channels]
      summary: Get a single channel's detail by its unique URL slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Channel detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDetail"
        "404":
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /channels/{id}/stream:
    post:
      operationId: createChannelStream
      tags: [channels]
      summary: Create or fetch this channel's live ingest credentials (RTMP URL, stream key, playback id)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ingest credentials for broadcasting software (OBS, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamCredentials"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not the channel owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /channels/{id}/analytics:
    get:
      operationId: getChannelAnalytics
      tags: [channels]
      summary: Get actionable live analytics for the current channel owner
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Creator analytics based on stream sessions and recorded chat activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelAnalytics"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not the channel owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /channels/{id}/heartbeat:
    post:
      operationId: channelHeartbeat
      tags: [channels]
      summary: Viewer heartbeat — increments viewer count while watching a live stream. Call every 30 seconds.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Heartbeat acknowledged
          content:
            application/json:
              schema:
                type: object
                required: [viewerCount]
                properties:
                  viewerCount: { type: integer }
        "404":
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /channels/{id}/stream/reset:
    post:
      operationId: resetChannelStream
      tags: [channels]
      summary: Regenerate the stream key (invalidates the old one)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: New ingest credentials with a fresh stream key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamCredentials"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not the channel owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /channels/{id}/follow:
    post:
      operationId: followChannel
      tags: [channels]
      summary: Follow a channel
      parameters:
        - name: id
          in: path
          required: true
