            - type: "null"
        paymentAddress: { type: ["string", "null"] }
        qrCodeDataUrl: { type: ["string", "null"] }
        invoiceAmount: { type: ["string", "null"] }
        invoiceCommission: { type: ["string", "null"] }
        invoiceTotal: { type: ["string", "null"] }
        providerFeePaidBy: { type: string, enum: [client] }

