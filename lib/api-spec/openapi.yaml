              schema:
                $ref: "#/components/schemas/AdminAdCampaign"
        "400": { description: Invalid campaign input }
        "403": { description: Not an owner }

  /admin/ads/campaigns/{id}/funding-invoice:
    post:
      operationId: createAdminAdFundingInvoice
      tags: [admin-ads]
      summary: Create a crypto-only advertiser funding invoice for an unfunded paid campaign
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminAdFundingInvoiceInput"
      responses:
        "201":
          description: Pending crypto campaign funding invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAdFundingInvoice"
        "403": { description: Not an owner }
        "409": { description: Campaign cannot be funded }
        "503": { description: Crypto provider configuration is incomplete }

  /admin/ads/campaigns/{id}/approve:
    post:
      operationId: approveAdminAdCampaign
      tags: [admin-ads]
      summary: Approve an owner-controlled promotional flight or signed crypto-funded campaign for delivery
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Approved advertising campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAdCampaign"
        "403": { description: Not an owner }
        "409": { description: Funding or delivery-window requirement is not met }

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Owner-only platform totals
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "403":
          description: Not an owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/feature-flags:
    get:
      operationId: listAdminFeatureFlags
      tags: [admin]
      summary: Owner-only platform feature flags and emergency kill switches
      responses:
        "200":
          description: Feature flags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminFeatureFlag"
        "403":
          description: Not an owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/feature-flags/{key}:
    patch:
      operationId: updateAdminFeatureFlag
      tags: [admin]
      summary: Owner-only — change a platform feature flag or kill switch
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminFeatureFlagInput"
      responses:
        "200":
          description: Updated feature flag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFeatureFlag"
        "400":
          description: Invalid update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not an owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Flag not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: Owner-only user list
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "403":
          description: Not an owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/users/{id}:
    patch:
      operationId: updateAdminUser
      tags: [admin]
      summary: Owner-only — ban or unban a user
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "403":
          description: Not an owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/users/{id}/activity:
    get:
      operationId: getAdminUserActivity
      tags: [admin]
      summary: Owner-only minimized user activity detail with audited access
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: User activity detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserActivityDetail"
        "403":
          description: Not an owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/channels:
    get:
      operationId: listAdminChannels
      tags: [admin]
      summary: Owner-only channel list
      responses:
        "200":
          description: Channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChannelSummary"
        "403":
          description: Not an owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/channels/{id}:
    delete:
      operationId: deleteAdminChannel
      tags: [admin]
      summary: Owner-only — remove a channel
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "403":
          description: Not an owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/videos:
    get:
      operationId: listAdminVideos
      tags: [admin]
      summary: Owner-only video list
      responses:
        "200":
          description: Videos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VideoSummary"
        "403":
          description: Not an owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/videos/{id}:
    delete:
      operationId: deleteAdminVideo
      tags: [admin]
      summary: Owner-only — remove a video
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "403":
          description: Not an owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Video not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Category:
      type: object
      required: [id, name, slug, kind, imageUrl, liveChannelCount, viewerCount]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        kind:
          description: live_game categories power Kryv Live's browse sidebar; genre categories power Kryv Watch/Cinema
          type: string
          enum: [live_game, genre]
        imageUrl: { type: ["string", "null"] }
        liveChannelCount: { type: integer }
        viewerCount: { type: integer }

    ChannelSummary:
      type: object
      required:
        [
          id,
          slug,
          displayName,
          avatarUrl,
          bannerUrl,
          streamTitle,
          isLive,
          viewerCount,
          followerCount,
          subscriberCount,
          categoryId,
          categoryName,
          playbackId,
        ]
      properties:
        id: { type: integer }
        slug: { type: string }
        displayName: { type: string }
        avatarUrl: { type: ["string", "null"] }
        bannerUrl: { type: ["string", "null"] }
        streamTitle: { type: ["string", "null"] }
        isLive: { type: boolean }
        viewerCount: { type: integer }
        followerCount: { type: integer }
        subscriberCount: { type: integer }
        categoryId: { type: ["integer", "null"] }
        categoryName: { type: ["string", "null"] }
        playbackId:
          description: FastPix playback id used to build the HLS playback URL. Null until the channel has gone live at least once.
          type: ["string", "null"]
        fastpixPlaybackId:
          description: FastPix playback id used to build the HLS playback URL. Null until the channel has gone live at least once.
          type: ["string", "null"]

    ChannelDetail:
      allOf:
        - $ref: "#/components/schemas/ChannelSummary"
        - type: object
          required: [description, websiteUrl, youtubeUrl, instagramUrl, xUrl, isFollowing, isSubscribed, isOwner, ownerUserId, createdAt]
          properties:
            description: { type: ["string", "null"] }
            websiteUrl: { type: ["string", "null"], format: uri }
            youtubeUrl: { type: ["string", "null"], format: uri }
            instagramUrl: { type: ["string", "null"], format: uri }
            xUrl: { type: ["string", "null"], format: uri }
            isFollowing: { type: boolean }
            isSubscribed: { type: boolean }
            isOwner: { type: boolean }
            ownerUserId: { type: integer }
            createdAt: { type: string, format: date-time }

    CreatorProfile:
      type: object
      required: [channel, live, watch, cinemaCredits]
      properties:
        channel:
          $ref: "#/components/schemas/ChannelDetail"
        live:
          $ref: "#/components/schemas/CreatorProfileLive"
        watch:
          type: array
          items:
            $ref: "#/components/schemas/VideoSummary"
        cinemaCredits:
          type: array
          items:
            $ref: "#/components/schemas/CreatorCinemaCredit"

    CreatorProfileLive:
      type: object
      required: [isLive, streamTitle, viewerCount, categoryName, recentStreams]
      properties:
        isLive: { type: boolean }
        streamTitle: { type: ["string", "null"] }
        viewerCount: { type: integer }
        categoryName: { type: ["string", "null"] }
        recentStreams:
          type: array
          items:
            $ref: "#/components/schemas/CreatorProfileStream"

    CreatorProfileStream:
      type: object
      required: [id, title, startedAt, endedAt, durationSeconds]
      properties:
        id: { type: integer }
        title: { type: ["string", "null"] }
        startedAt: { type: string, format: date-time }
        endedAt: { type: ["string", "null"], format: date-time }
        durationSeconds: { type: ["integer", "null"] }

    CreatorCinemaCredit:
      allOf:
        - $ref: "#/components/schemas/CinemaTitle"
        - type: object
          required: [role]
          properties:
            role: { type: string }

    ChannelInput:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 60 }
        description: { type: string, maxLength: 500 }
        categoryId: { type: integer }

    ChannelUpdate:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 60 }
        description: { type: string, maxLength: 500 }
        websiteUrl: { type: ["string", "null"], format: uri, pattern: '^https://.+' }
        youtubeUrl: { type: ["string", "null"], format: uri, pattern: '^https://(www\\.)?(youtube\\.com|youtu\\.be)/.+' }
        instagramUrl: { type: ["string", "null"], format: uri, pattern: '^https://(www\\.)?instagram\\.com/.+' }
        xUrl: { type: ["string", "null"], format: uri, pattern: '^https://(www\\.)?(x\\.com|twitter\\.com)/.+' }
        avatarUrl: { type: string }
        bannerUrl: { type: string }
        categoryId: { type: integer }
        streamTitle: { type: string, maxLength: 140 }

    ChannelAnalytics:
      type: object
      required:
        [
          periodDays,
          isLive,
          currentViewerCount,
          followerCount,
          subscriberCount,
          totalStreams,
          totalStreamSeconds,
          peakViewers,
          averageViewers,
          totalChatMessages,
          recentStreams,
        ]
      properties:
        periodDays: { type: integer, description: Rolling measurement period in calendar days }
        isLive: { type: boolean }
        currentViewerCount: { type: integer }
        followerCount: { type: integer }
        subscriberCount: { type: integer }
        totalStreams: { type: integer }
        totalStreamSeconds: { type: integer }
        peakViewers: { type: integer }
        averageViewers: { type: integer }
        totalChatMessages: { type: integer }
        recentStreams:
          type: array
          items:
            type: object
            required: [id, title, startedAt, endedAt, durationSeconds, peakViewers, averageViewers, totalChatMessages]
            properties:
              id: { type: integer }
              title: { type: ["string", "null"] }
              startedAt: { type: string, format: date-time }
              endedAt: { type: ["string", "null"], format: date-time }
              durationSeconds: { type: ["integer", "null"] }
              peakViewers: { type: integer }
              averageViewers: { type: integer }
              totalChatMessages: { type: integer }

    StreamCredentials:
      type: object
      required: [rtmpUrl, streamKey, playbackId]
      properties:
        rtmpUrl:
          description: RTMP ingest server URL to enter in broadcasting software (e.g. OBS)
          type: string
        streamKey:
          description: Secret stream key — combined with rtmpUrl to start broadcasting. Never shown to anyone but the owner.
          type: string
        playbackId:
          description: FastPix playback id for this channel's live stream
          type: string
        fastpixPlaybackId:
          description: FastPix playback id for this channel's live stream
          type: ["string", "null"]

    NotificationPreferences:
      type: object
      required: [notifyOnLive, notifyOnUpload, notifyOnClip, emailNotifications]
      properties:
        notifyOnLive: { type: boolean }
        notifyOnUpload: { type: boolean }
        notifyOnClip: { type: boolean }
        emailNotifications: { type: boolean }

    NotificationPreferencesInput:
      type: object
      required: [notifyOnLive, notifyOnUpload, notifyOnClip, emailNotifications]
      properties:
        notifyOnLive: { type: boolean }
        notifyOnUpload: { type: boolean }
        notifyOnClip: { type: boolean }
        emailNotifications: { type: boolean }

    SearchResults:
      type: object
      required: [channels, videos, clips]
      properties:
        channels:
          type: array
          items: { $ref: "#/components/schemas/ChannelSummary" }
        videos:
          type: array
          items: { $ref: "#/components/schemas/VideoSummary" }
        clips:
          type: array
          items: { $ref: "#/components/schemas/ClipSummary" }

    CryptoCurrency:
      type: string
      enum: [BTC, LTC, ETH, DOGE]

    CryptoCheckout:
      type: object
      required: [paymentIntentId, invoiceUrl, provider, status, selectedCurrency, expiresAt]
      properties:
        paymentIntentId: { type: integer }
        invoiceUrl: { type: string, description: Branded fallback checkout URL. Kryv clients prefer returned payment instructions when available. }
        provider: { type: string, enum: [crypto], description: Customer-facing payment method label; payment-provider identity is not displayed to viewers. }
        status: { type: string, enum: [pending] }
        selectedCurrency:
          oneOf:
            - $ref: "#/components/schemas/CryptoCurrency"
            - type: "null"
        expiresAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        paymentAddress:
          oneOf:
            - type: string
            - type: "null"
          description: Per-invoice public payment address. It is never a creator payout destination.
        qrCodeDataUrl:
          oneOf:
            - type: string
            - type: "null"
          description: Per-invoice QR image data URL for Kryv checkout presentation.
        invoiceAmount:
          oneOf:
            - type: string
            - type: "null"
          description: Provider-confirmed merchant invoice amount in the selected cryptocurrency, excluding the client-borne provider commission.
        invoiceCommission:
          oneOf:
            - type: string
            - type: "null"
          description: Provider-confirmed commission in the selected cryptocurrency.
        invoiceTotal:
          oneOf:
            - type: string
            - type: "null"
          description: Provider-confirmed total amount the customer must send in the selected cryptocurrency.
        providerFeePaidBy: { type: string, enum: [client] }
        creatorShareBps: { type: integer, minimum: 0, maximum: 10000, description: Creator share in basis points under the active Kryv settlement policy. }
        platformFeeBps: { type: integer, minimum: 0, maximum: 10000, description: Kryv platform share in basis points under the active settlement policy. This is separate from the client-borne provider checkout commission. }

    CryptoSubscriptionInput:
      type: object
      properties:
        tier: { type: integer, minimum: 1, maximum: 3, default: 1 }
        cryptoCurrency: { $ref: "#/components/schemas/CryptoCurrency" }

    CryptoTipInput:
      type: object
      required: [amount]
      properties:
        amount: { type: number, exclusiveMinimum: 0, maximum: 100000, description: USD price quote used to create the selected crypto invoice; it is not a card or fiat checkout. }
        cryptoCurrency: { $ref: "#/components/schemas/CryptoCurrency" }
        message: { type: string, maxLength: 500 }

    WalletTipInput:
      type: object
      required: [currency, amount]
      properties:
        currency: { $ref: "#/components/schemas/CryptoCurrency" }
        amount: { type: string, pattern: "^\\d+(\\.\\d{1,8})?$", description: Exact crypto amount to debit from the customer’s confirmed Kryv wallet balance. }
        message: { type: string, maxLength: 500 }

    WalletTipPayment:
      type: object
      required: [paymentIntentId, tipId, currency, grossAmount, platformFeeAmount, creatorNetAmount, status]
      properties:
        paymentIntentId: { type: integer }
        tipId: { type: integer }
        currency: { $ref: "#/components/schemas/CryptoCurrency" }
        grossAmount: { type: string }
        platformFeeAmount: { type: string }
        creatorNetAmount: { type: string }
        status: { type: string, enum: [completed] }

    ChannelEngagementChoice:
      type: object
      required: [id, title, votes]
      properties:
        id: { type: integer }
        title: { type: string }
        votes: { type: integer }
        channelPoints: { type: integer }
        users: { type: integer }
        color: { type: string }

    ChannelEngagementPoll:
      type: object
      required: [id, title, status, durationSeconds, startedAt, choices]
      properties:
        id: { type: integer }
        title: { type: string }
        status: { type: string }
        durationSeconds: { type: integer }
        startedAt: { type: string, format: date-time }
        choices:
          type: array
          items: { $ref: "#/components/schemas/ChannelEngagementChoice" }

    ChannelEngagementPrediction:
      type: object
      required: [id, title, status, predictionWindowSeconds, startedAt, outcomes]
      properties:
        id: { type: integer }
        title: { type: string }
        status: { type: string }
        predictionWindowSeconds: { type: integer }
        startedAt: { type: string, format: date-time }
        outcomes:
          type: array
          items: { $ref: "#/components/schemas/ChannelEngagementChoice" }

    ChannelEngagement:
      type: object
      required: [pointsBalance, pointsEnabled, activePoll, activePrediction]
      properties:
        pointsBalance: { type: ["integer", "null"] }
        pointsEnabled: { type: boolean }
        activePoll:
          anyOf:
            - $ref: "#/components/schemas/ChannelEngagementPoll"
            - type: "null"
        activePrediction:
          anyOf:
            - $ref: "#/components/schemas/ChannelEngagementPrediction"
            - type: "null"

    ChannelEngagementActionInput:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [claim_points, create_reward, redeem_reward, create_poll, vote_poll, end_poll, create_prediction, enter_prediction, lock_prediction, resolve_prediction, raid, set_host, clear_host]
        title: { type: string, maxLength: 140 }
        description: { type: string, maxLength: 500 }
        choices:
          type: array
          minItems: 2
          maxItems: 5
          items: { type: string, maxLength: 80 }
        pollId: { type: integer }
        choiceId: { type: integer }
        predictionId: { type: integer }
        outcomeId: { type: integer }
        rewardId: { type: integer }
        targetChannelId: { type: integer }
        channelPoints: { type: integer, minimum: 1, maximum: 100000 }
        durationSeconds: { type: integer, minimum: 30, maximum: 3600 }
        autoHost: { type: boolean }
        userInput: { type: string, maxLength: 300 }

    ChannelEngagementActionResult:
      type: object
      required: [action]
      properties:
        action: { type: string }
        status: { type: string }
        entityId: { type: integer }
        targetChannelId: { type: integer }
        pointsBalance: { type: integer }
        awarded: { type: integer }

    ClipSummary:
      type: object
      required: [id, title, thumbnailUrl, durationSeconds, viewCount, channelId, channelName, channelSlug, processingStatus, playbackId, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        thumbnailUrl: { type: ["string", "null"] }
        durationSeconds: { type: ["integer", "null"] }
        viewCount: { type: integer }
        channelId: { type: integer }
        channelName: { type: string }
        channelSlug: { type: string }
        processingStatus: { type: string, enum: [processing, ready, errored] }
        playbackId:
          description: FastPix playback ID. Present only when the clip is ready for playback.
          type: ["string", "null"]
        createdAt: { type: string, format: date-time }

    ClipInput:
      type: object
      required: [startTime, endTime, title]
      oneOf:
        - required: [videoId]
        - required: [channelId]
      properties:
        videoId:
          description: Ready VOD source. Only the source channel owner may request this clip type.
          type: integer
        channelId:
          description: Active public live-channel source. An authenticated viewer may request this clip type while the broadcast is active.
          type: integer
        startTime: { type: number, minimum: 0 }
        endTime: { type: number, exclusiveMinimum: 0 }
        title: { type: string, minLength: 1, maxLength: 100 }

    VideoSummary:
      type: object
      required:
        [
          id,
          title,
          thumbnailUrl,
          posterUrl,
          backdropUrl,
          durationSeconds,
          viewCount,
          channelId,
          channelSlug,
          channelName,
          channelAvatarUrl,
          categoryId,
          categoryName,
          contentType,
          playbackId,
          uploadStatus,
          createdAt,
        ]
      properties:
        id: { type: integer }
        title: { type: string }
        thumbnailUrl:
          description: Landscape 16:9 thumbnail — used in Kryv Watch grids
          type: ["string", "null"]
        posterUrl:
          description: Portrait 2:3 poster — used in Kryv Cinema rows
          type: ["string", "null"]
        backdropUrl:
          description: Wide cinematic backdrop — used in Kryv Cinema hero banners
          type: ["string", "null"]
        durationSeconds: { type: ["integer", "null"] }
        viewCount: { type: integer }
        channelId: { type: integer }
        channelSlug: { type: string }
        channelName: { type: string }
        channelAvatarUrl: { type: ["string", "null"] }
        categoryId: { type: ["integer", "null"] }
        categoryName: { type: ["string", "null"] }
        contentType:
          type: string
          enum: [upload, original]
        playbackId:
          description: FastPix playback id for HLS playback. Null until FastPix finishes processing the upload.
          type: ["string", "null"]
        uploadStatus:
          type: string
          enum: [waiting, processing, ready, errored]
        createdAt: { type: string, format: date-time }

    VideoDetail:
      allOf:
        - $ref: "#/components/schemas/VideoSummary"
        - type: object
          required: [description, isOwner]
          properties:
            description: { type: ["string", "null"] }
            isOwner: { type: boolean }

    VideoInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 5000 }
        categoryId: { type: integer }
        contentType:
          type: string
          enum: [upload, original]

    VideoCreateResponse:
      allOf:
        - $ref: "#/components/schemas/VideoDetail"
        - type: object
          required: [uploadUrl]
          properties:
            uploadUrl:
              description: FastPix direct-upload URL — PUT the raw video file here from the browser
              type: string

    VideoUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 5000 }
        categoryId: { type: integer }

    CinemaTitle:
      type: object
      required: [id, slug, title, synopsis, maturityLevel, genres, posterUrl, backdropUrl, runtimeSeconds, featurePlaybackId, trailerPlaybackId, entitlementType, publishedAt]
      properties:
        id: { type: integer }
        slug: { type: string }
