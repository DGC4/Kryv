        fundingId: { type: integer }
        paymentIntentId: { type: integer }
        invoiceUrl: { type: string }
        provider: { type: string, enum: [crypto] }
        status: { type: string, enum: [pending] }
        selectedCurrency:
          oneOf:
            - $ref: "#/components/schemas/CryptoCurrency"
            - type: "null"
        expiresAt:
          oneOf:
            - type: string
