openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Kryv live streaming platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: me
    description: Current user operations
  - name: categories
    description: Browse categories
  - name: channels
    description: Channel operations (Kryv Live — Twitch/Kick-style live streaming)
  - name: chat
    description: Live chat operations
  - name: moderation
    description: Channel moderation and chat-safety operations
  - name: discover
    description: Discovery / home page aggregates
  - name: clips
    description: Native short-form clips derived from Kryv video assets
  - name: videos
    description: On-demand video operations (Kryv Watch — YouTube-style uploads)
  - name: cinema
    description: Curated originals browsing (Kryv Cinema — Netflix-style library)
  - name: admin
    description: Owner-only backend administration (platform stats, user/channel/video moderation)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Get current user profile, own channel, and followed channels
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/profiles:
    get:
      operationId: listViewerProfiles
      tags: [me]
      summary: List the signed-in user's viewer profiles for profile-aware Cinema and watch state
      responses:
        "200":
          description: Viewer profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ViewerProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createViewerProfile
      tags: [me]
      summary: Create a viewer profile for the signed-in user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewerProfileInput"
      responses:
        "201":
          description: Created viewer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewerProfile"
        "400":
          description: Invalid viewer profile input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/profiles/{id}:
    patch:
      operationId: updateViewerProfile
      tags: [me]
      summary: Update a viewer profile owned by the signed-in user
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewerProfileUpdate"
      responses:
        "200":
          description: Updated viewer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewerProfile"
        "400":
          description: Invalid viewer profile input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Viewer profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteViewerProfile
      tags: [me]
      summary: Delete a non-default viewer profile owned by the signed-in user
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Viewer profile deleted
        "400":
          description: Default profile cannot be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Viewer profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /ads/decision:
    get:
      operationId: getAdDecision
      tags: [ads]
      summary: Evaluate whether a viewer session may receive a policy-eligible ad opportunity
      parameters:
        - name: surface
          in: query
          required: true
          schema: { type: string, enum: [live, watch, cinema, clip] }
        - name: channelId
          in: query
          required: false
          schema: { type: integer }
        - name: videoId
          in: query
          required: false
          schema: { type: integer }
        - name: profileId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: An explainable ad eligibility decision. A decision does not guarantee delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdDecision"

  /channels/{id}/ad-breaks:
    post:
      operationId: createChannelAdBreak
      tags: [ads]
      summary: Schedule or trigger an eligible creator ad break after server-side policy checks
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdBreakInput"
      responses:
        "201":
          description: Created ad opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdBreak"
        "400":
          description: Invalid ad break request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The creator or platform policy is not eligible to create an ad break
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/cinema/titles:
    get:
      operationId: listAdminCinemaTitles
      tags: [admin]
      summary: List owner-managed Cinema titles and their publishing state
      responses:
        "200":
          description: Cinema title drafts and published records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminCinemaTitle"
        "401": { description: Not authenticated }
        "403": { description: Owner access required }
    post:
      operationId: createAdminCinemaTitle
      tags: [admin]
      summary: Create a lawful Cinema title draft before rights and assets are approved
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCinemaTitleInput"
      responses:
        "201":
          description: Cinema title draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCinemaTitle"
        "400": { description: Invalid Cinema title input }
        "401": { description: Not authenticated }
        "403": { description: Owner access required }

  /admin/cinema/titles/{id}/assets:
    post:
      operationId: createAdminCinemaAsset
      tags: [admin]
      summary: Associate an approved FastPix feature, trailer, preview, or caption asset with a Cinema title
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCinemaAssetInput"
      responses:
        "201":
          description: Cinema asset associated with title
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCinemaAsset"
        "400": { description: Invalid Cinema asset input }
        "401": { description: Not authenticated }
        "403": { description: Owner access required }
        "404": { description: Cinema title not found }

  /admin/cinema/titles/{id}:
    get:
      operationId: getAdminCinemaTitle
      tags: [admin]
      summary: Retrieve the complete owner publishing record for a Cinema title
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Owner Cinema title detail, asset manifest, rights windows, readiness, and activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCinemaTitleDetail"
        "401": { description: Not authenticated }
        "403": { description: Owner access required }
        "404": { description: Cinema title not found }
    patch:
      operationId: updateAdminCinemaTitle
      tags: [admin]
      summary: Update title metadata or move a Cinema title through the governed publication workflow
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCinemaTitleUpdate"
      responses:
        "200":
          description: Updated owner Cinema title detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCinemaTitleDetail"
        "400": { description: Invalid title update }
        "401": { description: Not authenticated }
        "403": { description: Owner access required }
        "404": { description: Cinema title not found }
        "409": { description: The requested publication state is not eligible }

  /admin/cinema/titles/{id}/rights-windows:
    post:
      operationId: createAdminCinemaRightsWindow
      tags: [admin]
      summary: Add a rights and entitlement window to a Cinema title
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCinemaRightsWindowInput"
      responses:
        "201":
          description: Rights window added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCinemaRightsWindow"
        "400": { description: Invalid rights window }
        "401": { description: Not authenticated }
        "403": { description: Owner access required }
        "404": { description: Cinema title not found }

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List browse categories with live counts. Filter by kind — live_game categories for Kryv Live, genre categories for Kryv Watch/Cinema.
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [live_game, genre]
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /discover/summary:
    get:
      operationId: getDiscoverSummary
      tags: [discover]
      summary: Home page aggregate — featured live channels, top categories, totals
      responses:
        "200":
          description: Discovery summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverSummary"

  /search:
    get:
      operationId: searchKryv
      tags: [discover]
      summary: Search public live channels, uploaded videos, and ready clips
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 64 }
      responses:
        "200":
          description: Search results grouped by content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        "400":
          description: Invalid search query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/followed/live:
    get:
      operationId: listFollowedLiveChannels
      tags: [discover]
      summary: List the signed-in viewer's followed channels that are currently live
      responses:
        "200":
          description: Followed live channels ranked by viewers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChannelSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/notification-preferences:
    get:
      operationId: getNotificationPreferences
      tags: [users]
      summary: Get the signed-in user's global notification preferences
      responses:
        "200":
          description: Current global notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: updateNotificationPreferences
      tags: [users]
      summary: Update the signed-in user's global notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferencesInput"
      responses:
        "200":
          description: Updated global notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "400":
          description: Invalid preference input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /channels:
    get:
      operationId: listChannels
      tags: [channels]
      summary: Browse channels, optionally filtered by category, live status, or search
      parameters:
        - name: categorySlug
          in: query
          required: false
          schema:
            type: string
        - name: live
          in: query
          required: false
          schema:
            type: boolean
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChannelSummary"
    post:
      operationId: createChannel
      tags: [channels]
      summary: Create a channel for the current user (become a creator)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelInput"
      responses:
        "201":
          description: Created channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDetail"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: User already has a channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /channels/{id}:
    get:
      operationId: getChannel
      tags: [channels]
      summary: Get a single channel's detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Channel detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDetail"
        "404":
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateChannel
      tags: [channels]
      summary: Update the current user's own channel (profile, category, offline)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelUpdate"
      responses:
        "200":
          description: Updated channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDetail"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not the channel owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /channels/slug/{slug}:
    get:
      operationId: getChannelBySlug
      tags: [channels]
      summary: Get a single channel's detail by its unique URL slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Channel detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDetail"
        "404":
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /channels/{id}/stream:
    post:
      operationId: createChannelStream
      tags: [channels]
      summary: Create or fetch this channel's live ingest credentials (RTMP URL, stream key, playback id)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ingest credentials for broadcasting software (OBS, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamCredentials"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not the channel owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /channels/{id}/analytics:
    get:
      operationId: getChannelAnalytics
      tags: [channels]
      summary: Get actionable live analytics for the current channel owner
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Creator analytics based on stream sessions and recorded chat activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelAnalytics"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not the channel owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /channels/{id}/heartbeat:
    post:
      operationId: channelHeartbeat
      tags: [channels]
      summary: Viewer heartbeat — increments viewer count while watching a live stream. Call every 30 seconds.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Heartbeat acknowledged
          content:
            application/json:
              schema:
                type: object
                required: [viewerCount]
                properties:
                  viewerCount: { type: integer }
        "404":
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /channels/{id}/stream/reset:
    post:
      operationId: resetChannelStream
      tags: [channels]
      summary: Regenerate the stream key (invalidates the old one)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: New ingest credentials with a fresh stream key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamCredentials"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not the channel owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /channels/{id}/follow:
    post:
      operationId: followChannel
      tags: [channels]
      summary: Follow a channel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDetail"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: unfollowChannel
      tags: [channels]
      summary: Unfollow a channel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDetail"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /channels/{id}/chat-settings:
    get:
      operationId: getChannelChatSettings
      tags: [chat]
      summary: Get the public chat participation settings for a channel
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Chat participation settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelChatSettings"
        "404":
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateChannelChatSettings
      tags: [moderation]
      summary: Update chat slow mode and follower-only mode for the current channel owner
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelChatSettingsUpdate"
      responses:
        "200":
          description: Updated chat participation settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelChatSettings"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not the channel owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /channels/{id}/moderation/actions:
    post:
      operationId: createChannelModerationAction
      tags: [moderation]
      summary: Perform an owner or moderator action in a channel
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelModerationActionInput"
      responses:
        "200":
          description: Moderation action completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelModerationActionResult"
        "400":
          description: Invalid action input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted to perform this action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Channel, user, or message not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /channels/{id}/subscribe:
    post:
      operationId: createCryptoSubscription
      tags: [channels]
      summary: Start a crypto-only channel subscription invoice; no entitlement is granted until a signed callback settles it
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CryptoSubscriptionInput"
      responses:
        "201":
          description: Pending crypto invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CryptoCheckout"
        "401": { description: Authentication required }
        "404": { description: Channel not found }
        "503": { description: Crypto commerce is not configured or active }

  /channels/{id}/tip:
    post:
      operationId: createCryptoTip
      tags: [channels]
      summary: Start a crypto-only creator tip invoice; a balance changes only after signed provider confirmation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
