        advertiserName: { type: string, minLength: 2, maxLength: 140 }
        fundingMode: { type: string, enum: [promotional, paid] }
        budgetUsd: { type: string, pattern: "^\\d+(\\.\\d{1,2})?$", description: USD reference amount used only to obtain a crypto funding invoice; it is not a fiat charge. }
        creatorShareBps: { type: integer, minimum: 0, maximum: 10000, default: 0 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }

