openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Kryv live streaming platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: me
    description: Current user operations
  - name: categories
    description: Browse categories
  - name: channels
    description: Channel operations (Kryv Live — Twitch/Kick-style live streaming)
  - name: chat
    description: Live chat operations
  - name: moderation
    description: Channel moderation and chat-safety operations
  - name: discover
    description: Discovery / home page aggregates
  - name: clips
    description: Native short-form clips derived from Kryv video assets
  - name: videos
    description: On-demand video operations (Kryv Watch — YouTube-style uploads)
  - name: cinema
    description: Curated originals browsing (Kryv Cinema — Netflix-style library)
  - name: admin
    description: Owner-only backend administration (platform stats, user/channel/video moderation)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Get current user profile, own channel, and followed channels
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List browse categories with live counts. Filter by kind — live_game categories for Kryv Live, genre categories for Kryv Watch/Cinema.
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [live_game, genre]
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /discover/summary:
    get:
      operationId: getDiscoverSummary
      tags: [discover]
      summary: Home page aggregate — featured live channels, top categories, totals
      responses:
        "200":
          description: Discovery summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverSummary"

  /search:
    get:
      operationId: searchKryv
      tags: [discover]
      summary: Search public live channels, uploaded videos, and ready clips
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 64 }
      responses:
        "200":
          description: Search results grouped by content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        "400":
          description: Invalid search query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/followed/live:
    get:
      operationId: listFollowedLiveChannels
      tags: [discover]
      summary: List the signed-in viewer's followed channels that are currently live
      responses:
        "200":
          description: Followed live channels ranked by viewers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChannelSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/notification-preferences:
    get:
      operationId: getNotificationPreferences
      tags: [users]
      summary: Get the signed-in user's global notification preferences
      responses:
        "200":
          description: Current global notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: updateNotificationPreferences
      tags: [users]
      summary: Update the signed-in user's global notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferencesInput"
      responses:
        "200":
          description: Updated global notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "400":
          description: Invalid preference input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /channels:
    get:
      operationId: listChannels
      tags: [channels]
      summary: Browse channels, optionally filtered by category, live status, or search
      parameters:
        - name: categorySlug
          in: query
          required: false
          schema:
            type: string
        - name: live
          in: query
          required: false
          schema:
            type: boolean
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChannelSummary"
    post:
      operationId: createChannel
      tags: [channels]
      summary: Create a channel for the current user (become a creator)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelInput"
      responses:
        "201":
          description: Created channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDetail"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: User already has a channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /channels/{id}:
    get:
      operationId: getChannel
      tags: [channels]
      summary: Get a single channel's detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Channel detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDetail"
        "404":
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateChannel
      tags: [channels]
      summary: Update the current user's own channel (profile, category, offline)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelUpdate"
      responses:
        "200":
          description: Updated channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDetail"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not the channel owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /channels/slug/{slug}:
    get:
      operationId: getChannelBySlug
      tags: [channels]
      summary: Get a single channel's detail by its unique URL slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Channel detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDetail"
        "404":
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /channels/{id}/stream:
    post:
      operationId: createChannelStream
      tags: [channels]
      summary: Create or fetch this channel's live ingest credentials (RTMP URL, stream key, playback id)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ingest credentials for broadcasting software (OBS, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamCredentials"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not the channel owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /channels/{id}/analytics:
    get:
      operationId: getChannelAnalytics
      tags: [channels]
      summary: Get actionable live analytics for the current channel owner
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Creator analytics based on stream sessions and recorded chat activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelAnalytics"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not the channel owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /channels/{id}/heartbeat:
    post:
      operationId: channelHeartbeat
      tags: [channels]
      summary: Viewer heartbeat — increments viewer count while watching a live stream. Call every 30 seconds.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Heartbeat acknowledged
          content:
            application/json:
              schema:
                type: object
                required: [viewerCount]
                properties:
                  viewerCount: { type: integer }
        "404":
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /channels/{id}/stream/reset:
    post:
      operationId: resetChannelStream
      tags: [channels]
      summary: Regenerate the stream key (invalidates the old one)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: New ingest credentials with a fresh stream key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamCredentials"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not the channel owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /channels/{id}/follow:
    post:
      operationId: followChannel
      tags: [channels]
      summary: Follow a channel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDetail"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: unfollowChannel
      tags: [channels]
      summary: Unfollow a channel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDetail"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /channels/{id}/chat-settings:
    get:
      operationId: getChannelChatSettings
      tags: [chat]
      summary: Get the public chat participation settings for a channel
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Chat participation settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelChatSettings"
        "404":
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateChannelChatSettings
      tags: [moderation]
      summary: Update chat slow mode and follower-only mode for the current channel owner
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelChatSettingsUpdate"
      responses:
        "200":
          description: Updated chat participation settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelChatSettings"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not the channel owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /channels/{id}/moderation/actions:
    post:
      operationId: createChannelModerationAction
      tags: [moderation]
      summary: Perform an owner or moderator action in a channel
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelModerationActionInput"
      responses:
        "200":
          description: Moderation action completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelModerationActionResult"
        "400":
          description: Invalid action input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted to perform this action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Channel, user, or message not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /channels/{id}/monetization/status:
    get:
      operationId: getChannelMonetizationStatus
      tags: [channels]
      summary: Get an owner’s Stripe Connect onboarding and capability status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Creator payment-account status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelMonetizationStatus"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Channel-owner permission required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /channels/{id}/monetization/onboarding-link:
    post:
      operationId: createChannelMonetizationOnboardingLink
      tags: [channels]
      summary: Create a short-lived Stripe-hosted onboarding link for the channel owner
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: One-time hosted onboarding URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelMonetizationOnboardingLink"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Channel-owner permission required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Payment provider not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /channels/{id}/engagement:
    get:
      operationId: getChannelEngagement
      tags: [channels]
      summary: Get public channel-points, poll, and prediction state for a channel
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Current engagement state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelEngagement"
        "404":
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /channels/{id}/engagement/actions:
    post:
      operationId: createChannelEngagementAction
      tags: [channels]
      summary: Perform an authenticated viewer or channel-owner engagement action
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelEngagementActionInput"
      responses:
        "200":
          description: Action completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelEngagementActionResult"
        "201":
          description: Engagement resource created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelEngagementActionResult"
        "400":
          description: Invalid engagement action or current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Channel-owner permission required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /channels/{id}/messages:
    get:
      operationId: listChannelMessages
      tags: [chat]
      summary: List recent chat messages for a channel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Recent chat messages, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
        "404":
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createChannelMessage
      tags: [chat]
      summary: Post a chat message to a channel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "201":
          description: Created chat message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /clips:
    get:
      operationId: listClips
      tags: [clips]
      summary: Browse public, ready-to-play Kryv clips
      parameters:
        - name: channelId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Public clips ordered by most recently created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClipSummary"
    post:
      operationId: createClip
      tags: [clips]
      summary: Request a FastPix clip from an owned, ready Kryv video
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClipInput"
      responses:
        "201":
          description: Clip request accepted and processing asynchronously
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClipSummary"
        "400":
          description: Invalid clip range or source video state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not the source video's channel owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /clips/{id}:
    get:
      operationId: getClip
      tags: [clips]
      summary: Get a public, ready-to-play Kryv clip
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Clip detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClipSummary"
        "404":
          description: Clip not found or not yet publicly available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /videos:
    get:
      operationId: listVideos
      tags: [videos]
      summary: Browse on-demand videos (Kryv Watch), optionally filtered by channel, genre, or search
      parameters:
        - name: channelId
          in: query
          required: false
          schema:
            type: integer
        - name: categorySlug
          in: query
          required: false
          schema:
            type: string
        - name: contentType
          in: query
          required: false
          schema:
            type: string
            enum: [upload, original]
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of videos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VideoSummary"
    post:
      operationId: createVideo
      tags: [videos]
      summary: Create a video record and start a direct upload session for the current user's channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoInput"
      responses:
        "201":
          description: Created video with an upload URL for the raw video file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoCreateResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Current user has no channel yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /videos/{id}:
    get:
      operationId: getVideo
      tags: [videos]
      summary: Get a single video's detail and register a view
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Video detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoDetail"
        "404":
          description: Video not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateVideo
      tags: [videos]
      summary: Update a video's metadata (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoUpdate"
      responses:
        "200":
          description: Updated video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoDetail"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not the video owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Video not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteVideo
      tags: [videos]
      summary: Delete a video (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not the video owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Video not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /cinema/home:
    get:
      operationId: getCinemaHome
      tags: [cinema]
      summary: Kryv Cinema home page — hero title plus genre rows of curated originals
      responses:
        "200":
          description: Cinema home layout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CinemaHome"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Owner-only platform totals
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "403":
          description: Not an owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: Owner-only user list
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "403":
          description: Not an owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/users/{id}:
    patch:
      operationId: updateAdminUser
      tags: [admin]
      summary: Owner-only — ban or unban a user
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "403":
          description: Not an owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/channels:
    get:
      operationId: listAdminChannels
      tags: [admin]
      summary: Owner-only channel list
      responses:
        "200":
          description: Channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChannelSummary"
        "403":
          description: Not an owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/channels/{id}:
    delete:
      operationId: deleteAdminChannel
      tags: [admin]
      summary: Owner-only — remove a channel
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "403":
          description: Not an owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/videos:
    get:
      operationId: listAdminVideos
      tags: [admin]
      summary: Owner-only video list
      responses:
        "200":
          description: Videos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VideoSummary"
        "403":
          description: Not an owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/videos/{id}:
    delete:
      operationId: deleteAdminVideo
      tags: [admin]
      summary: Owner-only — remove a video
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "403":
          description: Not an owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Video not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Category:
      type: object
      required: [id, name, slug, kind, imageUrl, liveChannelCount, viewerCount]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        kind:
          description: live_game categories power Kryv Live's browse sidebar; genre categories power Kryv Watch/Cinema
          type: string
          enum: [live_game, genre]
        imageUrl: { type: ["string", "null"] }
        liveChannelCount: { type: integer }
        viewerCount: { type: integer }

    ChannelSummary:
      type: object
      required:
        [
          id,
          slug,
          displayName,
          avatarUrl,
          bannerUrl,
          streamTitle,
          isLive,
          viewerCount,
          followerCount,
          subscriberCount,
          categoryId,
          categoryName,
          playbackId,
        ]
      properties:
        id: { type: integer }
        slug: { type: string }
        displayName: { type: string }
        avatarUrl: { type: ["string", "null"] }
        bannerUrl: { type: ["string", "null"] }
        streamTitle: { type: ["string", "null"] }
        isLive: { type: boolean }
        viewerCount: { type: integer }
        followerCount: { type: integer }
        subscriberCount: { type: integer }
        categoryId: { type: ["integer", "null"] }
        categoryName: { type: ["string", "null"] }
        playbackId:
          description: FastPix playback id used to build the HLS playback URL. Null until the channel has gone live at least once.
          type: ["string", "null"]
        fastpixPlaybackId:
          description: FastPix playback id used to build the HLS playback URL. Null until the channel has gone live at least once.
          type: ["string", "null"]

    ChannelDetail:
      allOf:
        - $ref: "#/components/schemas/ChannelSummary"
        - type: object
          required: [description, isFollowing, isSubscribed, isOwner, ownerUserId, createdAt]
          properties:
            description: { type: ["string", "null"] }
            isFollowing: { type: boolean }
            isSubscribed: { type: boolean }
            isOwner: { type: boolean }
            ownerUserId: { type: integer }
            createdAt: { type: string, format: date-time }

    ChannelInput:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 60 }
        description: { type: string, maxLength: 500 }
        categoryId: { type: integer }

    ChannelUpdate:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 60 }
        description: { type: string, maxLength: 500 }
        avatarUrl: { type: string }
        bannerUrl: { type: string }
        categoryId: { type: integer }
        streamTitle: { type: string, maxLength: 140 }

    ChannelAnalytics:
      type: object
      required:
        [
          periodDays,
          isLive,
          currentViewerCount,
          followerCount,
          subscriberCount,
          totalStreams,
          totalStreamSeconds,
          peakViewers,
          averageViewers,
          totalChatMessages,
          recentStreams,
        ]
      properties:
        periodDays: { type: integer, description: Rolling measurement period in calendar days }
        isLive: { type: boolean }
        currentViewerCount: { type: integer }
        followerCount: { type: integer }
        subscriberCount: { type: integer }
        totalStreams: { type: integer }
        totalStreamSeconds: { type: integer }
        peakViewers: { type: integer }
        averageViewers: { type: integer }
        totalChatMessages: { type: integer }
        recentStreams:
          type: array
          items:
            type: object
            required: [id, title, startedAt, endedAt, durationSeconds, peakViewers, averageViewers, totalChatMessages]
            properties:
              id: { type: integer }
              title: { type: ["string", "null"] }
              startedAt: { type: string, format: date-time }
              endedAt: { type: ["string", "null"], format: date-time }
              durationSeconds: { type: ["integer", "null"] }
              peakViewers: { type: integer }
              averageViewers: { type: integer }
              totalChatMessages: { type: integer }

    StreamCredentials:
      type: object
      required: [rtmpUrl, streamKey, playbackId]
      properties:
        rtmpUrl:
          description: RTMP ingest server URL to enter in broadcasting software (e.g. OBS)
          type: string
        streamKey:
          description: Secret stream key — combined with rtmpUrl to start broadcasting. Never shown to anyone but the owner.
          type: string
        playbackId:
          description: FastPix playback id for this channel's live stream
          type: string
        fastpixPlaybackId:
          description: FastPix playback id for this channel's live stream
          type: ["string", "null"]

    NotificationPreferences:
      type: object
      required: [notifyOnLive, notifyOnUpload, notifyOnClip, emailNotifications]
      properties:
        notifyOnLive: { type: boolean }
        notifyOnUpload: { type: boolean }
        notifyOnClip: { type: boolean }
        emailNotifications: { type: boolean }

    NotificationPreferencesInput:
      type: object
      required: [notifyOnLive, notifyOnUpload, notifyOnClip, emailNotifications]
      properties:
        notifyOnLive: { type: boolean }
        notifyOnUpload: { type: boolean }
        notifyOnClip: { type: boolean }
        emailNotifications: { type: boolean }

    SearchResults:
      type: object
      required: [channels, videos, clips]
      properties:
        channels:
          type: array
          items: { $ref: "#/components/schemas/ChannelSummary" }
        videos:
          type: array
          items: { $ref: "#/components/schemas/VideoSummary" }
        clips:
          type: array
          items: { $ref: "#/components/schemas/ClipSummary" }

    ChannelMonetizationStatus:
      type: object
      required: [provider, onboardingStatus, chargesEnabled, payoutsEnabled, detailsSubmitted, requirementsDue]
      properties:
        provider: { type: string }
        onboardingStatus: { type: string, enum: [not_started, pending, complete, restricted] }
        chargesEnabled: { type: boolean }
        payoutsEnabled: { type: boolean }
        detailsSubmitted: { type: boolean }
        requirementsDue:
          type: array
          items: { type: string }

    ChannelMonetizationOnboardingLink:
      type: object
      required: [url, onboardingStatus]
      properties:
        url: { type: string }
        onboardingStatus: { type: string }

    ChannelEngagementChoice:
      type: object
      required: [id, title, votes]
      properties:
        id: { type: integer }
        title: { type: string }
        votes: { type: integer }
        channelPoints: { type: integer }
        users: { type: integer }
        color: { type: string }

    ChannelEngagementPoll:
      type: object
      required: [id, title, status, durationSeconds, startedAt, choices]
      properties:
        id: { type: integer }
        title: { type: string }
        status: { type: string }
        durationSeconds: { type: integer }
        startedAt: { type: string, format: date-time }
        choices:
          type: array
          items: { $ref: "#/components/schemas/ChannelEngagementChoice" }

    ChannelEngagementPrediction:
      type: object
      required: [id, title, status, predictionWindowSeconds, startedAt, outcomes]
      properties:
        id: { type: integer }
        title: { type: string }
        status: { type: string }
        predictionWindowSeconds: { type: integer }
        startedAt: { type: string, format: date-time }
        outcomes:
          type: array
          items: { $ref: "#/components/schemas/ChannelEngagementChoice" }

    ChannelEngagement:
      type: object
      required: [pointsBalance, pointsEnabled, activePoll, activePrediction]
      properties:
        pointsBalance: { type: ["integer", "null"] }
        pointsEnabled: { type: boolean }
        activePoll:
          anyOf:
            - $ref: "#/components/schemas/ChannelEngagementPoll"
            - type: "null"
        activePrediction:
          anyOf:
            - $ref: "#/components/schemas/ChannelEngagementPrediction"
            - type: "null"

    ChannelEngagementActionInput:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [claim_points, create_reward, redeem_reward, create_poll, vote_poll, end_poll, create_prediction, enter_prediction, lock_prediction, resolve_prediction, raid, set_host, clear_host]
        title: { type: string, maxLength: 140 }
        description: { type: string, maxLength: 500 }
        choices:
          type: array
          minItems: 2
          maxItems: 5
          items: { type: string, maxLength: 80 }
        pollId: { type: integer }
        choiceId: { type: integer }
        predictionId: { type: integer }
        outcomeId: { type: integer }
        rewardId: { type: integer }
        targetChannelId: { type: integer }
        channelPoints: { type: integer, minimum: 1, maximum: 100000 }
        durationSeconds: { type: integer, minimum: 30, maximum: 3600 }
        autoHost: { type: boolean }
        userInput: { type: string, maxLength: 300 }

    ChannelEngagementActionResult:
      type: object
      required: [action]
      properties:
        action: { type: string }
        status: { type: string }
        entityId: { type: integer }
        targetChannelId: { type: integer }
        pointsBalance: { type: integer }
        awarded: { type: integer }

    ClipSummary:
      type: object
      required: [id, title, thumbnailUrl, durationSeconds, viewCount, channelId, channelName, channelSlug, processingStatus, playbackId, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        thumbnailUrl: { type: ["string", "null"] }
        durationSeconds: { type: ["integer", "null"] }
        viewCount: { type: integer }
        channelId: { type: integer }
        channelName: { type: string }
        channelSlug: { type: string }
        processingStatus: { type: string, enum: [processing, ready, errored] }
        playbackId:
          description: FastPix playback ID. Present only when the clip is ready for playback.
          type: ["string", "null"]
        createdAt: { type: string, format: date-time }

    ClipInput:
      type: object
      required: [videoId, startTime, endTime, title]
      properties:
        videoId: { type: integer }
        startTime: { type: number, minimum: 0 }
        endTime: { type: number, exclusiveMinimum: 0 }
        title: { type: string, minLength: 1, maxLength: 100 }

    VideoSummary:
      type: object
      required:
        [
          id,
          title,
          thumbnailUrl,
          posterUrl,
          backdropUrl,
          durationSeconds,
          viewCount,
          channelId,
          channelName,
          channelAvatarUrl,
          categoryId,
          categoryName,
          contentType,
          playbackId,
          uploadStatus,
          createdAt,
        ]
      properties:
        id: { type: integer }
        title: { type: string }
        thumbnailUrl:
          description: Landscape 16:9 thumbnail — used in Kryv Watch grids
          type: ["string", "null"]
        posterUrl:
          description: Portrait 2:3 poster — used in Kryv Cinema rows
          type: ["string", "null"]
        backdropUrl:
          description: Wide cinematic backdrop — used in Kryv Cinema hero banners
          type: ["string", "null"]
        durationSeconds: { type: ["integer", "null"] }
        viewCount: { type: integer }
        channelId: { type: integer }
        channelName: { type: string }
        channelAvatarUrl: { type: ["string", "null"] }
        categoryId: { type: ["integer", "null"] }
        categoryName: { type: ["string", "null"] }
        contentType:
          type: string
          enum: [upload, original]
        playbackId:
          description: FastPix playback id for HLS playback. Null until FastPix finishes processing the upload.
          type: ["string", "null"]
        uploadStatus:
          type: string
          enum: [waiting, processing, ready, errored]
        createdAt: { type: string, format: date-time }

    VideoDetail:
      allOf:
        - $ref: "#/components/schemas/VideoSummary"
        - type: object
          required: [description, isOwner]
          properties:
            description: { type: ["string", "null"] }
            isOwner: { type: boolean }

    VideoInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 5000 }
        categoryId: { type: integer }
        contentType:
          type: string
          enum: [upload, original]

    VideoCreateResponse:
      allOf:
        - $ref: "#/components/schemas/VideoDetail"
        - type: object
          required: [uploadUrl]
          properties:
            uploadUrl:
              description: FastPix direct-upload URL — PUT the raw video file here from the browser
              type: string

    VideoUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 5000 }
        categoryId: { type: integer }

    CinemaRow:
      type: object
      required: [title, items]
      properties:
        title: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/VideoSummary"

    CinemaHome:
      type: object
      required: [hero, rows]
      properties:
        hero:
          oneOf:
            - $ref: "#/components/schemas/VideoSummary"
            - type: "null"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/CinemaRow"

    ChannelChatSettings:
      type: object
      required: [slowModeSeconds, followersOnly]
      properties:
        slowModeSeconds: { type: integer, minimum: 0, maximum: 300 }
        followersOnly: { type: boolean }

    ChannelChatSettingsUpdate:
      type: object
      properties:
        slowModeSeconds: { type: integer, minimum: 0, maximum: 300 }
        followersOnly: { type: boolean }

    ChannelModerationActionInput:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [add_moderator, remove_moderator, timeout, ban, unban, delete_message]
        targetUserId: { type: integer }
        messageId: { type: integer }
        durationSeconds: { type: integer, minimum: 1, maximum: 2592000 }
        reason: { type: string, maxLength: 500 }

    ChannelModerationActionResult:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [add_moderator, remove_moderator, timeout, ban, unban, delete_message]
        targetUserId: { type: ["integer", "null"] }
        messageId: { type: ["integer", "null"] }
        expiresAt: { type: ["string", "null"], format: date-time }

    ChatMessage:
      type: object
      required: [id, channelId, userId, username, avatarUrl, message, createdAt]
      properties:
        id: { type: integer }
        channelId: { type: integer }
        userId: { type: string }
        username: { type: string }
        avatarUrl: { type: ["string", "null"] }
        message: { type: string }
        createdAt: { type: string, format: date-time }

    ChatMessageInput:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 500 }

    Me:
      type: object
      required: [id, username, avatarUrl, role, channel, followedChannels]
      properties:
        id: { type: integer }
        username: { type: string }
        avatarUrl: { type: ["string", "null"] }
        role: { type: string, enum: [user, owner] }
        channel:
          oneOf:
            - $ref: "#/components/schemas/ChannelSummary"
            - type: "null"
        followedChannels:
          type: array
          items:
            $ref: "#/components/schemas/ChannelSummary"

    AdminStats:
      type: object
      required:
        [
          totalUsers,
          totalChannels,
          liveChannels,
          totalVideos,
          totalViews,
          bannedUsers,
        ]
      properties:
        totalUsers: { type: integer }
        totalChannels: { type: integer }
        liveChannels: { type: integer }
        totalVideos: { type: integer }
        totalViews: { type: integer }
        bannedUsers: { type: integer }

    AdminUser:
      type: object
      required: [id, username, avatarUrl, role, banned, createdAt]
      properties:
        id: { type: string }
        username: { type: string }
        avatarUrl: { type: ["string", "null"] }
        role: { type: string, enum: [user, owner] }
        banned: { type: boolean }
        createdAt: { type: string, format: date-time }

    AdminUserUpdate:
      type: object
      properties:
        banned: { type: boolean }

    DiscoverSummary:
      type: object
      required: [featuredChannels, topCategories, totalLiveChannels, totalViewers]
      properties:
        featuredChannels:
          type: array
          items:
            $ref: "#/components/schemas/ChannelSummary"
        topCategories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        totalLiveChannels: { type: integer }
        totalViewers: { type: integer }
